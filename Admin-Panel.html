<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Portal - Entry Management</title>

<style>

    :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-color: #f8fafc;
        --accent-color: #38bdf8;
        --border-color: #334155;
        --success-color: #4ade80;
        --error-color: #f87171;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            sans-serif;

        background-color: var(--bg-color);
        color: var(--text-color);

        display: flex;
        justify-content: center;
        align-items: center;

        min-height: 100vh;
        padding: 20px;
    }

    .admin-card {
        background: var(--card-bg);

        border: 1px solid var(--border-color);

        border-radius: 12px;

        padding: 32px;

        width: 100%;
        max-width: 420px;

        box-shadow:
            0 10px 15px -3px
            rgba(0, 0, 0, 0.3);
    }

    .admin-card h2 {
        font-size: 1.4rem;
        color: var(--accent-color);
        margin-bottom: 8px;
    }

    .admin-card p {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 24px;
        line-height: 1.5;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 8px;
        color: #cbd5e1;
    }

    input {
        width: 100%;

        padding: 12px;

        border-radius: 6px;

        border: 1px solid var(--border-color);

        background: #090d16;

        color: #fff;

        font-size: 1rem;

        outline: none;
    }

    input:focus {
        border-color: var(--accent-color);
    }

    input::-webkit-calendar-picker-indicator {
        filter: invert(1);
        cursor: pointer;
    }

    button {
        width: 100%;

        padding: 12px;

        background: var(--accent-color);

        color: #000;

        font-weight: bold;

        border: none;

        border-radius: 6px;

        font-size: 1rem;

        cursor: pointer;

        transition: opacity 0.2s;
    }

    button:hover {
        opacity: 0.9;
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    #statusMsg {
        margin-top: 16px;

        font-size: 0.9rem;

        text-align: center;

        font-weight: 500;

        min-height: 20px;
    }

</style>

</head>

<body>

<div class="admin-card">

    <h2>
        Admin Value Control
    </h2>

    <p>
        Select the date, result value and exact reveal time.
        The result will become visible on the user panel
        only after the selected time.
    </p>


    <form id="adminForm">


        <!-- DATE -->

        <div class="form-group">

            <label for="entryDate">
                Select Date
            </label>

            <input
                type="date"
                id="entryDate"
                required
            >

        </div>


        <!-- VALUE -->

        <div class="form-group">

            <label for="entryValue">
                Result Value
            </label>

            <input
                type="number"
                id="entryValue"
                min="1"
                max="100"
                placeholder="e.g. 75"
                required
            >

        </div>


        <!-- REVEAL TIME -->

        <div class="form-group">

            <label for="revealTime">
                Result Reveal Time
            </label>

            <input
                type="time"
                id="revealTime"
                required
            >

        </div>


        <button
            type="submit"
            id="submitBtn"
        >
            Save Entry to Sheet
        </button>

    </form>


    <div id="statusMsg"></div>

</div>

<script>


/* =========================================================
   IMPORTANT:
   Use the SAME Apps Script URL in Admin Panel and my.html
========================================================= */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzpxIkDecNsPVrqgLaa9GsOOgSBvD01tuUzyimrFZyxVlIoVg1zfAlkM-0lmvjXxApMvA/exec";


/* =========================================================
   GET TODAY DATE
   Do NOT use toISOString() because it uses UTC.
========================================================= */

function getTodayLocal() {

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(now.getMonth() + 1)
            .padStart(2, "0");

    const day =
        String(now.getDate())
            .padStart(2, "0");

    return `${year}-${month}-${day}`;
}


/* Set today's date */

document.getElementById("entryDate").value =
    getTodayLocal();


/* =========================================================
   FORM SUBMIT
========================================================= */

document.getElementById("adminForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();


    const status =
        document.getElementById("statusMsg");


    const submitBtn =
        document.getElementById("submitBtn");


    const date =
        document.getElementById("entryDate").value;


    const value =
        Number(
            document.getElementById("entryValue").value
        );


    const revealTime =
        document.getElementById("revealTime").value;


    /* =========================
       VALIDATION
    ========================= */

    if (!date) {

        status.style.color =
            "var(--error-color)";

        status.innerText =
            "Please select a date.";

        return;
    }


    if (
        Number.isNaN(value) ||
        value < 1 ||
        value > 100
    ) {

        status.style.color =
            "var(--error-color)";

        status.innerText =
            "Result must be between 1 and 100.";

        return;
    }


    if (!revealTime) {

        status.style.color =
            "var(--error-color)";

        status.innerText =
            "Please select reveal time.";

        return;
    }


    /* =========================
       DISABLE BUTTON
    ========================= */

    submitBtn.disabled = true;


    status.style.color =
        "var(--accent-color)";

    status.innerText =
        "Saving to Google Sheets...";


    /* =========================
       DATA TO SEND
    ========================= */

    const payload = {

        date: date,

        value: value,

        revealTime: revealTime

    };


    console.log(
        "Sending to Apps Script:",
        payload
    );


    /* =========================
       SEND
    ========================= */

    try {

        const response =
            await fetch(
                SCRIPT_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify(payload)
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP Error: " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "Apps Script response:",
            result
        );


        if (!result.success) {

            throw new Error(
                result.message ||
                "Apps Script failed"
            );

        }


        /* =========================
           SUCCESS
        ========================= */

        status.style.color =
            "var(--success-color)";

        status.innerText =
            `Saved successfully: ${date} → ${value} at ${revealTime}`;


        /* Clear value and time */

        document.getElementById(
            "entryValue"
        ).value = "";


        document.getElementById(
            "revealTime"
        ).value = "";


    } catch (error) {

        console.error(
            "Save error:",
            error
        );


        status.style.color =
            "var(--error-color)";


        status.innerText =
            "Failed to save result: " +
            error.message;

    }


    submitBtn.disabled = false;

});


</script>

</body>

</html>
